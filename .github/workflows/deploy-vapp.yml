name: Deploy Vapp frontend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-vapp
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Vapp
    runs-on: ubuntu-latest
    environment: vapp
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vapp
        env:
          PORT: "3000"
          BASE_PATH: /
          VITE_PLATFORM_API_BASE_URL: https://api.vamberic.com
          VITE_COGNITO_REGION: eu-west-2
          VITE_COGNITO_USER_POOL_ID: eu-west-2_CogD1Prpz
          VITE_COGNITO_CLIENT_ID: 4pnadj0nk0chv865shdqtb4p9r
          VITE_COGNITO_DOMAIN: https://vamberic-dev-vapp-755905325223.auth.eu-west-2.amazoncognito.com
        run: pnpm --filter @workspace/vapp run build

      - name: Verify build output
        shell: bash
        run: |
          test -d artifacts/vapp/dist/public
          test -s artifacts/vapp/dist/public/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::755905325223:role/VambericDevVapp-VappDeploymentRoleB8CD46CD-y5f4T2p0mWwz
          aws-region: eu-west-2

      - name: Sync Vapp to S3
        run: aws s3 sync artifacts/vapp/dist/public/ s3://vambericdevvapp-vappbucketf8cb2aac-xzrw6jpr9pbm --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EUYTHCWBZ81X4 --paths "/*"
