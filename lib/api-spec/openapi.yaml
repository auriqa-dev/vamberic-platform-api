  /v1/opportunities:
    get:
      operationId: listOpportunities
      tags:
        - opportunities
      summary: List opportunities
      description: Private, read-only CRM projection. Archived records are excluded. Detail events are limited to the most recent 10; linked relationships are current for people and organisations.
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - in: query
          name: status
          schema:
            type: string
            enum:
              - open
              - won
              - lost
              - paused
        - in: query
          name: stage
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - in: query
          name: productId
          schema:
            type: string
            pattern: ^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
