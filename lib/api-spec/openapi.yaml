openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /
    description: API root
security:
  - cognitoAccessToken: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Vapp operational overview
  - name: products
    description: Product management
paths:
  /v1/people/{id}/delete-preview:
    get:
      operationId: getPersonDeletePreview
      tags:
        - people
      summary: Preview permanent person deletion
      description: Private administrative operation using existing Cognito authentication. Financial/customer history and non-test consent block deletion. DELETE requires exact confirmation and the current preview token; dependencies and blockers are checked again in a transaction.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^person_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$
      responses:
        "200":
          description: Deletion preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmDeletePreview"
        "400":
          description: Invalid ID or explicit confirmation missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmDeleteError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmDeleteError"
        "409":
          description: Protected dependencies, changed preview or excessive scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmDeleteError"
        "503":
          description: Transactional deletion unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmDeleteError"
