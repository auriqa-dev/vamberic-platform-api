openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /
    description: API root
tags:
  - name: health
    description: Health operations
paths:
  /health:
    get:
      operationId: rootHealthCheck
      tags: [health]
      summary: Root health check
      description: Returns safe service health metadata
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /api/v1/health:
    get:
      operationId: versionedHealthCheck
      tags: [health]
      summary: Versioned health check
      description: Returns safe service health metadata
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        serviceName:
          type: string
        environment:
          type: string
          enum: [development, test, production]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - serviceName
        - environment
        - version
        - timestamp

