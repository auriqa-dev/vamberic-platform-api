  /v1/public/products/{productId}/enquiries:
    post:
      security: []
      operationId: submitPublicEnquiry
      tags: [public-enquiries]
      summary: Submit a product enquiry without signing in
      description: Creates shared CRM records atomically. Marketing opt-in requires consent text and version. Separate submissions create separate enquiry events and opportunities.
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            pattern: "^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEnquiryInput"
      responses:
        "201":
          description: Enquiry received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryReceived"
        "400":
          description: Invalid enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "403":
          description: Origin not approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "404":
          description: Product unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "409":
          description: Enquiry cannot be resolved safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "413":
          description: Payload exceeds 16 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "415":
          description: JSON content type required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
        "503":
          description: Enquiry capture temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEnquiryError"
  /health:
    get:
      security: []
      operationId: rootHealthCheck
      tags: [health]
      summary: Root health check
      description: Returns safe service health metadata
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/health:
    get:
      security: []
      operationId: versionedHealthCheck
