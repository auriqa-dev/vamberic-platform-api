  /v1/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get Vapp dashboard counts
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Current domain counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /v1/products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List and filter products
      parameters:
        - in: query
          name: search
          schema:
            type: string
            maxLength: 200
        - in: query
          name: lifecycleStatus
          schema:
            $ref: "#/components/schemas/LifecycleStatus"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Products ordered by most recently updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: "^product_[0-7][0-9abcdefghjkmnpqrstvwxyz]{25}$"
    get:
      operationId: getProduct
      tags: [products]
      summary: Get one product
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token for the configured Vapp client. ID tokens are not accepted.
  responses:
    Unauthorized:
      description: Missing or invalid Cognito access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
