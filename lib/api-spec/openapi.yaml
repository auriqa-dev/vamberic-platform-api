  schemas:
    PublicEnquiryInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, workEmail, company, message]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Explicit given name; trimmed, never split
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Explicit family name; trimmed, never split
        workEmail:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address; trimmed and normalized for matching
          format: email
        company:
          type: string
          minLength: 1
          maxLength: 300
          description: Company name; exact normalized whitespace match only
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Enquiry message; plain text
        website:
          type: string
          minLength: 1
          maxLength: 253
          description: Domain or HTTP(S) website; never fetched
        jobTitle:
          type: string
          minLength: 1
          maxLength: 200
          description: Submitted job title
        serviceInterest:
          type: string
          minLength: 1
          maxLength: 200
          description: Service of interest; not an Offer identifier
        source:
          type: string
          minLength: 1
          maxLength: 200
          description: Attribution source
        medium:
          type: string
          minLength: 1
          maxLength: 200
          description: Attribution medium
        campaign:
          type: string
          minLength: 1
          maxLength: 200
          description: Campaign label, not an internal Campaign ID
        content:
          type: string
          minLength: 1
          maxLength: 200
          description: Attribution content
        term:
          type: string
          minLength: 1
          maxLength: 200
          description: Attribution term
        landingPage:
          type: string
          minLength: 1
          maxLength: 1000
          description: HTTP(S) landing page URL
        referrer:
          type: string
          minLength: 1
          maxLength: 1000
          description: HTTP(S) referrer URL
        marketingConsentText:
          type: string
          minLength: 1
          maxLength: 1000
          description: Exact wording shown; required when marketingOptIn is true
        marketingConsentVersion:
          type: string
          minLength: 1
          maxLength: 100
          description: Wording version; required when marketingOptIn is true
        marketingOptIn:
          type: boolean
          description: Only explicit true with evidence creates a product-scoped email marketing consent decision
